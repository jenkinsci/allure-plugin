name: Compatibility Smoke

permissions:
  contents: read

on:
  pull_request:
    branches:
      - '*'
    paths:
      - '.github/workflows/compat.yml'
      - '.mvn/**'
      - 'compat/jenkins-smoke/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'pom.xml'
      - 'src/**'
  workflow_dispatch:
    inputs:
      jenkins_version:
        description: Jenkins Docker tag or core version to test
        required: true
        default: '2.462.1'
        type: string

concurrency:
  group: compat-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build plugin artifact
        run: ./mvnw -B -ntp -DskipTests clean package
      - name: Upload plugin hpi
        uses: actions/upload-artifact@v4
        with:
          name: plugin-hpi
          path: target/*.hpi
          if-no-files-found: error

  compat:
    runs-on: ubuntu-latest
    needs: build-plugin
    timeout-minutes: 45
    env:
      JENKINS_VERSION: ${{ inputs.jenkins_version || '2.462.1' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download plugin hpi
        uses: actions/download-artifact@v4
        with:
          name: plugin-hpi
          path: target
      - name: Run Jenkins compatibility smoke
        env:
          COMPAT_ARTIFACT_ROOT: ${{ github.workspace }}/compat-artifacts/${{ env.JENKINS_VERSION }}
          ALLURE_DUMP: ${{ github.workspace }}/allure-dumps/compat-${{ env.JENKINS_VERSION }}
        run: |
          echo "Running Jenkins compatibility smoke for version: $JENKINS_VERSION"
          mkdir -p "${ALLURE_DUMP%/*}"
          ALLURE_ENVIRONMENT_ID="jenkins-${JENKINS_VERSION//[^a-zA-Z0-9_-]/-}"
          npx --yes allure@3 run \
            --dump="$ALLURE_DUMP" \
            --environment="$ALLURE_ENVIRONMENT_ID" \
            -- ./mvnw -B -e -ntp -f compat/jenkins-smoke/pom.xml \
              -Dcompat.rootDir="${{ github.workspace }}" \
              -Dcompat.version="$JENKINS_VERSION" \
              -Dcompat.artifactRoot="$COMPAT_ARTIFACT_ROOT" \
              test
      - name: Upload Allure 3 dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ env.JENKINS_VERSION }}-allure3-dump
          path: allure-dumps/compat-${{ env.JENKINS_VERSION }}.zip
          if-no-files-found: error
      - name: Append workflow summary
        if: always()
        run: |
          DUMP_PATH="allure-dumps/compat-${JENKINS_VERSION}.zip"
          echo "## Jenkins ${JENKINS_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$DUMP_PATH" ]]; then
            DUMP_SIZE=$(du -h "$DUMP_PATH" | cut -f1)
            echo "- Allure 3 dump: \`${DUMP_PATH}\` (${DUMP_SIZE})" >> "$GITHUB_STEP_SUMMARY"
            echo "- Workflow artifact: \`compat-${JENKINS_VERSION}-allure3-dump\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Global evidence: Jenkins controller log, shared Jenkins setup inputs, and Maven process logs" >> "$GITHUB_STEP_SUMMARY"
            echo "- Generate a report: \`npx --yes allure@3 generate --config ./allurerc.mjs --dump=${DUMP_PATH}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Compatibility smoke did not produce an Allure 3 dump." >> "$GITHUB_STEP_SUMMARY"
          fi

  s3-compat:
    runs-on: ubuntu-latest
    needs: build-plugin
    timeout-minutes: 45
    env:
      JENKINS_VERSION: '2.528.3'
      COMPAT_ID: '2.528.3-s3'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download plugin hpi
        uses: actions/download-artifact@v4
        with:
          name: plugin-hpi
          path: target
      - name: Run S3 Artifact Manager latency compatibility test
        env:
          COMPAT_ARTIFACT_ROOT: ${{ github.workspace }}/compat-artifacts/${{ env.COMPAT_ID }}
          ALLURE_DUMP: ${{ github.workspace }}/allure-dumps/compat-${{ env.COMPAT_ID }}
        run: |
          mkdir -p "${ALLURE_DUMP%/*}"
          npx --yes allure@3 run \
            --dump="$ALLURE_DUMP" \
            --environment="jenkins-${COMPAT_ID//[^a-zA-Z0-9_-]/-}" \
            -- ./mvnw -B -e -ntp -f compat/jenkins-smoke/pom.xml \
              -Ps3-compat \
              -Dtest=S3ArtifactManagerCompatibilityTest \
              -Dcompat.rootDir="${{ github.workspace }}" \
              -Dcompat.version="$JENKINS_VERSION" \
              -Dcompat.artifactRoot="$COMPAT_ARTIFACT_ROOT" \
              test
      - name: Upload S3 compatibility Allure 3 dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ env.COMPAT_ID }}-allure3-dump
          path: allure-dumps/compat-${{ env.COMPAT_ID }}.zip
          if-no-files-found: error
      - name: Append S3 compatibility summary
        if: always()
        run: |
          DUMP_PATH="allure-dumps/compat-${COMPAT_ID}.zip"
          echo "## Jenkins ${JENKINS_VERSION} + S3 Artifact Manager" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$DUMP_PATH" ]]; then
            DUMP_SIZE=$(du -h "$DUMP_PATH" | cut -f1)
            echo "- Allure 3 dump: \`${DUMP_PATH}\` (${DUMP_SIZE})" >> "$GITHUB_STEP_SUMMARY"
            echo "- Workflow artifact: \`compat-${COMPAT_ID}-allure3-dump\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Evidence: MinIO/Toxiproxy configuration, remote archive state, latency metrics, and container logs" >> "$GITHUB_STEP_SUMMARY"
            echo "- Generate a report: \`npx --yes allure@3 generate --config ./allurerc.mjs --dump=${DUMP_PATH}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- S3 compatibility test did not produce an Allure 3 dump." >> "$GITHUB_STEP_SUMMARY"
          fi

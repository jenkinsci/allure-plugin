VersionPolicy=Version policy
VersionPolicyDescription=Recommended Allure versions are tested and updated with this Jenkins plugin. \
  For Allure 3, the installer also manages a compatible Node.js runtime.
RecommendedVersion=Recommended Allure 3 ({0})
RecommendedAllure2Version=Recommended Allure 2 ({0})
FixedVersion=Fixed version
Version=Fixed version
VersionDescription=Used only with the fixed policy. Enter an exact Allure 2.x or 3.x version.
Allure2BaseUrl=Allure 2 Maven repository
Allure2BaseUrlDescription=Leave empty for Maven Central, or enter the HTTPS base URL of an internal Maven mirror. \
  The mirror must provide a .zip.sha256 sidecar for each Allure archive.
NodeDownloadBaseUrl=Node.js download mirror
NodeDownloadBaseUrlDescription=Leave empty for nodejs.org, or enter a controller-accessible mirror containing the \
  official Node.js distribution layout.
NpmRegistry=npm registry
NpmRegistryDescription=Used only for fixed Allure 3 versions not bundled with this plugin. \
  Enter an HTTPS registry that agents can reach. Dependencies are locked on first installation and reused with npm ci; \
  every locked package must use HTTPS and SHA-512 integrity.
